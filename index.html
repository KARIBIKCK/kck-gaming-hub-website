<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>KCK Gaming Hub</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

     <canvas id="particleCanvas"></canvas>
    <!-- ================================
         NAVIGATION
         ================================= -->

    <nav class="navbar">

        <div class="nav-control">

            <button
                id="menuButton"
                class="menu-button"
                onclick="toggleMenu()"
                aria-label="Open navigation">

                ☰

            </button>


            <select id="language" onchange="changeLanguage()">
    <option value="English">English</option>
    <option value="French">French</option>
    <option value="Spanish">Spanish</option>
    <option value="Russian">Russian</option>
    <option value="Arabic">Arabic</option>
</select>

        </div>


        <div
            id="menuPanel"
            class="menu-panel">

            <a href="#home">
                Home
            </a>

            <a href="#news">
                News
            </a>

            <a href="#contact">
                Contact
            </a>

            <a href="#about">
                About
            </a>

        </div>

    </nav>



    <!-- ================================
         MAIN HERO
         ================================= -->

    <section class="hero">


        <!-- SMALL LOGO -->

        <div class="logo">

            <div class="logo-image">

                <img
                    src="images/KCK-Logo.png"
                    alt="KCK Gaming Hub Logo">

            </div>

        </div>



        <!-- MAIN TITLE -->

        <div class="brand">

            <img
               src="images/KCK-Hero.png"
               alt="KCK Gaming Hub">

        </div>



        <!-- SUBTITLE -->

        <h3>

            BECOME A CHAMPION

        </h3>



        <!-- DESCRIPTION -->

        <p>

            Compete WorldWide,
            Prove Yourslef Among Players From Around The World,
            And Win Amazing Cash Prizes

        </p>



        <!-- SIGN IN -->

        <button
            onclick="joinTournament()">

            SIGN IN

        </button>


    </section>

<!-- =========================================
     SIGN IN PANEL
     ========================================= -->

<div id="loginPanel" class="login-panel">

    <div class="login-box">

        <button
            class="close-login"
            onclick="closeLogin()">
            ×
        </button>

        <h2>
            KCK GAMING HUB
        </h2>

        

        <input
            type="text"
            id="gamerName"
            placeholder="Gamer Name">

        <input
            type="email"
            id="email"
            placeholder="Email Address">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button
            class="login-submit"
            onclick="submitLogin()">
            ENTER GAMING HUB
        </button>

    </div>

</div>

    <script src="script.js"></script>

</body>

</html>
